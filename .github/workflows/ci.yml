name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-flight runs for the same branch/PR — successive pushes
# supersede earlier ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether the container sources changed, so the (slow) docker
  # sanity build only runs when it can actually catch something.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      container: ${{ steps.filter.outputs.container }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            container:
              - 'container/**'

  worker:
    name: Worker (typecheck + wrangler dry-run)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # wrangler 4.x requires Node 22+
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      # `wrangler deploy --dry-run` validates the config (bindings, DO
      # migrations, container image path) and bundles the worker —
      # catches issues the typecheck won't. We pass a dummy token so the
      # CLI doesn't fail authentication during PR builds.
      - name: Wrangler dry-run
        run: npm run deploy:dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || 'dry-run-noop' }}
          # Skip the container image build during dry-run. We only want
          # wrangler to validate config + bundle the worker; the image
          # itself is exercised by the dedicated `container` job below.
          # `/bin/true` makes every wrangler→docker invocation a no-op.
          WRANGLER_DOCKER_BIN: /bin/true

  mirror:
    name: Mirror worker (typecheck + wrangler dry-run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mirror/protomaps
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mirror/protomaps/package-lock.json

      - run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Wrangler dry-run
        run: npm run deploy:dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || 'dry-run-noop' }}

  container:
    name: Container (docker build)
    needs: changes
    # Only build when the container sources changed — the deploy
    # workflow rebuilds + publishes the image on main, so this job is
    # purely a pre-merge sanity check on the Dockerfile.
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Docker buildx is used so the Dockerfile's BuildKit syntax
      # (`# syntax=docker/dockerfile:1.7`) is respected. We don't push
      # the image here — this job exists only to fail the build if the
      # Dockerfile drifts or a system package disappears upstream.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker build (sanity)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: container
          file: container/Dockerfile
          push: false
          # GHA cache so consecutive CI runs reuse the apt + cargo
          # builder layers (the slow ones).
          cache-from: type=gha,scope=container
          cache-to: type=gha,scope=container,mode=max
