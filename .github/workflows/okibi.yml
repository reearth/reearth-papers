# Warming, after a change to this service's cache keys.
#
# This service has two kinds of epoch and they need two different watchers.
#
# The themes and the paint styles resolve part of their key at request time —
# the vector snapshot is a pointer in R2, a paint style's revision is a content
# hash of a document on a shelf — so they can go cold with nobody pushing, and
# nothing here would see it. Those are watched by this worker's own cron
# instead (`src/okibi_watch.ts`).
#
# The mirrored rasters are the other kind. Their version is a constant in
# `okibi.epochs.json`, so a commit is the whole signal, and this is where that
# signal is read. A bump to one of them re-bakes seconds of COG reads and
# resampling per tile: the last measurement put a miss at 1.2–3.5 s median and
# up to 7.7 s at p95.

name: okibi

on:
  pull_request:
    paths:
      - "okibi.epochs.json"
      - "okibi.manifest.json"
      - ".github/workflows/okibi.yml"
  push:
    branches: [main]
    paths:
      - "okibi.epochs.json"
      - "okibi.manifest.json"
      - ".github/workflows/okibi.yml"

permissions:
  contents: read

jobs:
  # On a pull request nothing is warmed. The estimate is posted, and that on
  # its own is the point: a commit that moves one version string has a price,
  # and a reviewer can see it next to the diff.
  estimate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2 # the previous commit's epochs, to diff against

      - name: Fetch the digests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.OKIBI_ACCOUNT_ID }}
        run: |
          mkdir -p digests
          for day in $(seq 1 7); do
            date=$(date -u -d "-$day day" +%Y-%m-%d)
            npx --yes wrangler@4 r2 object get \
              "reearth-papers/okibi/digests/$date.jsonl" \
              --file "digests/$date.jsonl" --remote || true
          done

      - uses: reearth/okibi/actions/plan@cbbc4122a0b72daad42d42a6009dcf2393b51da6 # v0.8.0
        with:
          manifests: okibi.manifest.json
          digests: digests/
          # The estimate is only worth reading if the URLs behind it exist.
          # This service has had that wrong before — ids that rebuilt nothing,
          # and a plan that read as correct while every request in it 404'd.
          verify: "5"
          warm-secret: ${{ secrets.OKIBI_WARM_SECRET }}

  # After the deploy, the same plan is derived and then run. Warming is a GET
  # to this worker's own tile path, so nothing here knows how a tile is made.
  warm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Warming is not part of shipping. If it fails the tiles are generated on
    # demand exactly as they would have been.
    continue-on-error: true
    concurrency:
      # A second deploy makes the first deploy's plan obsolete: it warms an
      # epoch that is no longer current.
      group: okibi-warm-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2

      - name: Fetch the digests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.OKIBI_ACCOUNT_ID }}
        run: |
          mkdir -p digests
          for day in $(seq 1 7); do
            date=$(date -u -d "-$day day" +%Y-%m-%d)
            npx --yes wrangler@4 r2 object get \
              "reearth-papers/okibi/digests/$date.jsonl" \
              --file "digests/$date.jsonl" --remote || true
          done

      - uses: reearth/okibi/actions/plan@cbbc4122a0b72daad42d42a6009dcf2393b51da6 # v0.8.0
        id: plan
        with:
          manifests: okibi.manifest.json
          digests: digests/
          comment: "false"
          verify: "5"
          warm-secret: ${{ secrets.OKIBI_WARM_SECRET }}
          # Warming the tiles people ask for in the morning, before morning.
          deadline: ${{ github.event.repository.pushed_at }}

      - uses: reearth/okibi/actions/warm@cbbc4122a0b72daad42d42a6009dcf2393b51da6 # v0.8.0
        if: steps.plan.outputs.plan != ''
        with:
          plan: ${{ steps.plan.outputs.plan }}
          manifests: okibi.manifest.json
          # Run it here if it fits in a job, hand it to the executor if not.
          mode: auto
          executor-url: ${{ vars.OKIBI_EXECUTOR_URL }}
          executor-token: ${{ secrets.OKIBI_EXECUTOR_TOKEN }}
          # Shared with this worker, which believes a request is okibi's only
          # when the header carries this value. Without it every warmed tile
          # is counted as demand and okibi warms it again tomorrow.
          warm-secret: ${{ secrets.OKIBI_WARM_SECRET }}
