name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys for the same ref at once, and don't cancel a
# deploy mid-flight — a half-rolled container is worse than a queued one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  # Deploy the mirror worker first. The main worker's renderer
  # container fetches `/style.json` and `/protomaps/...` from the
  # mirror, so any path/auth changes there need to land before the
  # main deploy or tile rendering breaks mid-rollout.
  mirror:
    name: Deploy mirror worker
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: mirror/protomaps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mirror/protomaps/package-lock.json

      - run: npm ci

      - name: Deploy mirror
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy worker + container
    needs: mirror
    runs-on: ubuntu-latest
    # GitHub Environment scopes the CLOUDFLARE_API_TOKEN to deploys and
    # (if configured) gates them behind required reviewers.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IMAGE_NAME: reearth-papers-tilerenderer
    steps:
      # Full history so we can diff `container/` against the previous
      # push to decide whether the image needs rebuilding.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Resolve the Cloudflare account ID for the registry image
      # reference. We can't rely on $CLOUDFLARE_ACCOUNT_ID being set
      # (wrangler itself derives the account from the API token, so the
      # secret may be empty) — an empty value would build a malformed
      # `registry.cloudflare.com//<image>` ref. Fall back to `wrangler
      # whoami`, which prints the 32-hex account ID.
      - name: Resolve Cloudflare account ID
        id: cf
        run: |
          ACCT="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -z "$ACCT" ]; then
            ACCT=$(npx wrangler whoami 2>/dev/null | grep -oiE '[0-9a-f]{32}' | head -1)
          fi
          if [ -z "$ACCT" ]; then
            echo "Could not resolve Cloudflare account ID" >&2
            exit 1
          fi
          echo "account_id=$ACCT" >> "$GITHUB_OUTPUT"

      # The image is content-addressed by the git tree hash of
      # `container/` — the tag changes if and only if the container
      # sources do. So a worker-only push reuses the image that's
      # already in the registry and never rebuilds it (this is what
      # turns a routine deploy from ~minutes-of-docker into seconds).
      - name: Compute image tag (container tree hash)
        id: tag
        run: echo "tag=$(git rev-parse "HEAD:container")" >> "$GITHUB_OUTPUT"

      # Build iff the container actually changed in this push (or we
      # can't tell — workflow_dispatch / first push / shallow before),
      # with a registry existence check as a safety net so a missing
      # image always triggers a build rather than a broken deploy.
      - name: Decide whether to (re)build the image
        id: decide
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BEFORE="${{ github.event.before }}"
          build=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build=true
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            build=true
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            build=true
          elif ! git diff --quiet "$BEFORE" "${{ github.sha }}" -- container/; then
            build=true
          fi
          if [ "$build" = "false" ]; then
            if ! npx wrangler containers images list 2>/dev/null | grep -q "$TAG"; then
              echo "Image ${IMAGE_NAME}:${TAG} not found in registry — will build."
              build=true
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Build image: $build (tag $TAG)"

      # buildx so the Dockerfile's BuildKit syntax is respected and the
      # slow apt + cargo (maplibre-native) layers are reused from the
      # GHA cache across runs. With the base image digest-pinned
      # (container/Dockerfile), this cache is stable across unrelated
      # Ubuntu security pushes.
      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: container
          file: container/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,scope=container,mode=max

      # Push the local image into Cloudflare's managed registry. wrangler
      # handles registry auth; the resulting URI is
      # registry.cloudflare.com/<account>/<image>:<tag>.
      - name: Push image to Cloudflare registry
        if: steps.decide.outputs.build == 'true'
        run: npx wrangler containers push "${IMAGE_NAME}:${{ steps.tag.outputs.tag }}"

      # Point wrangler at the pre-built image instead of the local
      # Dockerfile, so `wrangler deploy` references the registry image
      # and skips the container build entirely. We rewrite the committed
      # `image = "./container/Dockerfile"` line at deploy time only —
      # the repo keeps the Dockerfile reference so local `wrangler dev`
      # and `--dry-run` still build the container locally.
      - name: Point wrangler at the pre-built image
        run: |
          REF="registry.cloudflare.com/${{ steps.cf.outputs.account_id }}/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}"
          sed -i.bak "s|^image = \"./container/Dockerfile\"|image = \"${REF}\"|" wrangler.toml
          rm -f wrangler.toml.bak
          echo "Using image: $(grep '^image =' wrangler.toml)"

      # `scripts/deploy.sh` runs `wrangler deploy` (no docker build now)
      # and polls until the container rollout is live so a failed
      # rollout doesn't show as a green deploy.
      - name: Deploy
        run: npm run deploy

  # Exercise the whole public surface against the fresh deploy: every
  # catalog tileset, every themed style (papers AND stock — different
  # code paths), fonts, and — critically — a never-cached random deep
  # tile per theme that forces a full mirror-style → container → fonts
  # render. Cached tiles once masked a broken style pipeline for days;
  # the fresh-render leg fails the deploy the moment rendering breaks.
  # No rollback automation (containers make that hairy) — a red deploy
  # plus `git revert` is the recovery path.
  smoke:
    name: Post-deploy smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Smoke-test production
        run: node scripts/smoke.mjs
