<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Re:Earth Papers — preview</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.5.0/dist/maplibre-gl.css" />
  <style>
    :root {
      --paper: #f7f4ee;
      --paper-edge: #e3ded3;
      --ink: #1f1c17;
      --ink-soft: #8a8273;
      --accent: #b4490e;
      --card: #fffdf9;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-columns: 248px 1fr;
      font: 13px/1.45 system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    #map { height: 100%; }

    /* -- panel ------------------------------------------------------- */
    #panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      /* As a grid item, min-width:auto would let the mobile strip's
         content width blow the whole page out sideways. */
      min-width: 0;
      background:
        repeating-linear-gradient(0deg, transparent 0 23px, rgba(31,28,23,.025) 23px 24px),
        var(--paper);
      border-right: 1px solid var(--paper-edge);
    }
    #panel header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--paper-edge);
    }
    #panel h1 {
      margin: 0;
      font: 600 16px/1.2 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      letter-spacing: .01em;
    }
    #panel .sub {
      margin: 2px 0 0;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    /* -- gallery ------------------------------------------------------ */
    #gallery {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
      display: grid;
      /* max-content, not auto: Chrome collapses auto rows holding
         <button> items to their min-content height (~one line). */
      grid-auto-rows: max-content;
      gap: 10px;
      align-content: start;
    }
    .card {
      display: block;
      width: 100%;
      padding: 0;
      text-align: left;
      font: inherit;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--paper-edge);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .card:hover {
      border-color: #c9c2b2;
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(31,28,23,.08);
    }
    .card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 3px 10px rgba(180,73,14,.14);
    }
    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .thumb {
      display: block;
      height: 76px;
      overflow: hidden;
      position: relative;
      /* Vector / not-yet-loaded placeholder: faint contour-line sketch. */
      background:
        repeating-linear-gradient(115deg, transparent 0 9px, rgba(31,28,23,.07) 9px 10px),
        repeating-linear-gradient(25deg, transparent 0 14px, rgba(31,28,23,.05) 14px 15px),
        #efeadf;
    }
    .thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .25s;
    }
    .card:hover .thumb img { transform: scale(1.04); }
    .thumb .mvt {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .2em;
      color: var(--ink-soft);
    }
    .card .label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px 8px;
    }
    .card .name {
      font-weight: 550;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card .kind {
      flex: none;
      font: 500 9.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .card.selected .kind { color: var(--accent); }

    /* -- actions ------------------------------------------------------ */
    #actions {
      padding: 10px 12px;
      border-top: 1px solid var(--paper-edge);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    #actions button {
      font: inherit;
      font-size: 12px;
      padding: 4px 10px;
      border: 1px solid #c9c2b2;
      background: var(--card);
      border-radius: 5px;
      cursor: pointer;
    }
    #actions button:hover { background: #f3efe6; }
    #actions button:disabled { color: #b3ac9d; cursor: default; }
    #actions button.copied {
      background: #e4f3df;
      border-color: #8fbf80;
    }
    #gallery .pending {
      color: var(--ink-soft);
      font-style: italic;
      padding: 4px 2px;
    }

    /* -- mobile: gallery becomes a horizontal strip below the map ----- */
    @media (max-width: 720px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }
      #map { order: 0; }
      #panel {
        order: 1;
        border-right: none;
        border-top: 1px solid var(--paper-edge);
      }
      #panel header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 8px 12px 6px;
        border-bottom: none;
      }
      #panel h1 { font-size: 14px; }
      #gallery {
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 4px 12px 10px;
        gap: 8px;
        -webkit-overflow-scrolling: touch;
      }
      .card { flex: 0 0 132px; }
      .thumb { height: 60px; }
      .card .label { padding: 5px 8px 6px; }
      .card .kind { display: none; }
      #actions { padding: 8px 12px; border-top: none; }
    }

    /* -- vector inspector (layer panel + attribute popup) ------------- */
    #layers {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 210px;
      max-height: calc(100% - 20px);
      overflow-y: auto;
      z-index: 2;
      background: var(--card);
      border: 1px solid var(--paper-edge);
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(31,28,23,.15);
      font-size: 12px;
    }
    #layers h2 {
      position: sticky;
      top: 0;
      margin: 0;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font: 600 12px/1.2 'Iowan Old Style', Palatino, Georgia, serif;
      background: var(--card);
      border-bottom: 1px solid var(--paper-edge);
    }
    #layers .all {
      font: 500 10px/1 ui-monospace, Menlo, monospace;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: none;
      border: none;
      cursor: pointer;
    }
    #layers .all:hover { color: var(--accent); }
    #layers .lyr {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      cursor: pointer;
    }
    #layers .lyr:hover { background: #f3efe6; }
    #layers .lyr input { margin: 0; flex: none; }
    #layers .sw {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      flex: none;
      border: 1px solid rgba(0,0,0,.15);
    }
    #layers .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .maplibregl-popup-content { font: 12px/1.4 system-ui, -apple-system, sans-serif; }
    .ne-pop .h {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .ne-pop table { border-collapse: collapse; display: block; max-height: 240px; overflow: auto; }
    .ne-pop td { border-top: 1px solid #eee; padding: 1px 8px 1px 0; vertical-align: top; }
    .ne-pop td.k { color: var(--ink-soft); white-space: nowrap; }
    @media (max-width: 720px) {
      #layers { top: auto; bottom: 10px; right: 10px; max-height: 45%; width: 180px; }
    }
  </style>
</head>
<body>
  <aside id="panel">
    <header>
      <h1>Re:Earth Papers</h1>
      <p class="sub">tileset preview</p>
    </header>
    <nav id="gallery" aria-label="Tilesets">
      <p class="pending">loading /catalog.json…</p>
    </nav>
    <div id="actions">
      <button id="copy-tilejson" disabled type="button">Copy TileJSON URL</button>
      <button id="copy-xyz" disabled type="button">Copy XYZ URL</button>
    </div>
  </aside>
  <div id="map"></div>
  <script src="https://unpkg.com/maplibre-gl@5.5.0/dist/maplibre-gl.js"></script>
  <script>
    // Build the preview's tileset gallery from /catalog.json so adding
    // a new theme or raster source on the server side shows up here
    // without any HTML edit. Each card carries a live tile thumbnail
    // (a fixed z2 tile over Japan / East Asia) fetched through the
    // tileset's own TileJSON.
    //
    // Rendering mode is implicit: vector PMTiles tilesets (and only
    // those) are rendered client-side from a MapLibre style; raster
    // tilesets always show their served tiles.

    const THUMB = { z: 2, x: 3, y: 1 };

    function rasterStyle(tilejsonUrl) {
      return {
        version: 8,
        sources: {
          raster: { type: 'raster', url: tilejsonUrl, tileSize: 256 },
        },
        layers: [{ id: 'raster', type: 'raster', source: 'raster' }],
      };
    }

    let map = null;

    async function init() {
      const gallery = document.getElementById('gallery');
      const copyTilejson = document.getElementById('copy-tilejson');
      const copyXyz = document.getElementById('copy-xyz');

      let catalog;
      try {
        catalog = await fetch('/catalog.json').then((r) => r.json());
      } catch (e) {
        gallery.innerHTML = '<p class="pending">failed to load catalog</p>';
        return;
      }

      const tilesets = catalog.tilesets || [];
      let selected = null;

      // -- cards ----------------------------------------------------
      gallery.innerHTML = '';
      const cards = new Map();
      for (const t of tilesets) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'card';
        card.dataset.id = t.id;

        const thumb = document.createElement('span');
        thumb.className = 'thumb';
        if (t.type === 'vector') {
          // MVT has no image form — keep the sketch background and mark it.
          const mvt = document.createElement('span');
          mvt.className = 'mvt';
          mvt.textContent = 'MVT';
          thumb.appendChild(mvt);
        } else {
          const img = document.createElement('img');
          img.alt = '';
          img.loading = 'lazy';
          img.decoding = 'async';
          // Filled in asynchronously from the TileJSON below; on error
          // the placeholder background stays visible.
          img.addEventListener('error', () => img.remove());
          thumb.appendChild(img);
        }
        card.appendChild(thumb);

        const label = document.createElement('span');
        label.className = 'label';
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = t.name;
        name.title = t.name;
        // Passthrough tilesets are served straight from an upstream
        // provider — flag them so it's clear they aren't hosted by us.
        const kind = document.createElement('span');
        kind.className = 'kind';
        kind.textContent = t.passthrough ? t.type + '·pt' : t.type;
        kind.title = t.passthrough ? t.type + ' · passthrough' : t.type;
        label.appendChild(name);
        label.appendChild(kind);
        card.appendChild(label);

        card.addEventListener('click', () => select(t));
        gallery.appendChild(card);
        cards.set(t.id, card);
      }

      // -- thumbnails (async, best-effort) --------------------------
      // One TileJSON fetch per raster tileset; the documents are tiny
      // and edge-cached for 5 minutes.
      for (const t of tilesets) {
        if (t.type === 'vector') continue;
        fetch(t.tilejson)
          .then((r) => r.json())
          .then((tj) => {
            const tpl = tj.tiles && tj.tiles[0];
            const img = cards.get(t.id)?.querySelector('img');
            if (!tpl || !img) return;
            img.src = tpl
              .replace('{z}', THUMB.z)
              .replace('{x}', THUMB.x)
              .replace('{y}', THUMB.y);
          })
          .catch(() => {});
      }

      // -- vector inspector -----------------------------------------
      // A vector tileset that advertises `vector_layers` in its
      // TileJSON gets an "inspector": every source-layer rendered in
      // its own auto-assigned colour, individually toggleable, with
      // click-to-select + an attribute popup. Vector tilesets without
      // `vector_layers` (e.g. protomaps) fall back to a MapLibre style.
      let popup = null;
      let neLayers = []; // [{ src, color, ids:[fill,line,circle] }]
      const layersPanel = document.createElement('aside');
      layersPanel.id = 'layers';
      layersPanel.hidden = true;

      const EMPTY_FC = { type: 'FeatureCollection', features: [] };
      // Distinct, deterministic colour per layer index (golden-angle hue).
      const layerColor = (i) => `hsl(${Math.round(i * 137.508) % 360} 65% 45%)`;
      const esc = (v) =>
        String(v).replace(/[&<>"]/g, (s) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[s]));

      // Build a debug-style style doc: one fill+line+circle per source-
      // layer (only the geometry-matching ones actually paint), plus a
      // highlight source for the selected feature. Records neLayers.
      function buildInspectorStyle(t, tj) {
        // One style layer per source-layer, of the geometry the
        // TileJSON declares — so a polyline layer is never filled like a
        // polygon. Drawn polygons → lines → points, bottom to top.
        const polys = [], lines = [], points = [];
        neLayers = tj.vector_layers.map((vl, i) => {
          const c = layerColor(i);
          const id = `ne__${vl.id}`;
          const base = { id, source: 'ne', 'source-layer': vl.id };
          const geom = vl.geometry || 'polygon';
          if (geom === 'line') {
            lines.push({ ...base, type: 'line',
              paint: { 'line-color': c, 'line-width': 1.4 } });
          } else if (geom === 'point') {
            points.push({ ...base, type: 'circle',
              paint: { 'circle-color': c, 'circle-radius': 3.5,
                'circle-stroke-color': '#fff', 'circle-stroke-width': 1 } });
          } else {
            polys.push({ ...base, type: 'fill',
              paint: { 'fill-color': c, 'fill-opacity': 0.35, 'fill-outline-color': c } });
          }
          return { src: vl.id, color: c, geom, ids: [id] };
        });
        return {
          version: 8,
          glyphs: 'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf',
          sources: {
            ne: { type: 'vector', url: new URL(t.tilejson, location.href).toString(),
              attribution: tj.attribution || '' },
            selected: { type: 'geojson', data: EMPTY_FC },
          },
          layers: [
            { id: 'bg', type: 'background', paint: { 'background-color': '#f3f1ea' } },
            ...polys, ...lines, ...points,
            // Selection highlight (drawn on top); each only paints its
            // matching geometry.
            { id: 'sel-fill', type: 'fill', source: 'selected',
              paint: { 'fill-color': '#ff3b00', 'fill-opacity': 0.25 } },
            { id: 'sel-line', type: 'line', source: 'selected',
              paint: { 'line-color': '#ff3b00', 'line-width': 2.5 } },
            { id: 'sel-pt', type: 'circle', source: 'selected',
              paint: { 'circle-color': '#ff3b00', 'circle-radius': 6,
                'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } },
          ],
        };
      }

      // (Re)build the layer toggle panel from neLayers.
      function setupInspector() {
        layersPanel.innerHTML = '';
        const h = document.createElement('h2');
        const title = document.createElement('span');
        title.textContent = 'Layers';
        const allBtn = document.createElement('button');
        allBtn.type = 'button';
        allBtn.className = 'all';
        allBtn.textContent = 'toggle all';
        h.append(title, allBtn);
        layersPanel.appendChild(h);

        const setVis = (layer, on) => {
          for (const id of layer.ids) {
            if (map.getLayer(id)) {
              map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none');
            }
          }
        };

        const boxes = [];
        for (const layer of neLayers) {
          const row = document.createElement('label');
          row.className = 'lyr';
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = true;
          const sw = document.createElement('span');
          sw.className = 'sw';
          sw.style.background = layer.color;
          const nm = document.createElement('span');
          nm.className = 'nm';
          nm.textContent = layer.src;
          nm.title = layer.src;
          cb.addEventListener('change', () => setVis(layer, cb.checked));
          row.append(cb, sw, nm);
          layersPanel.appendChild(row);
          boxes.push(cb);
        }

        let allOn = true;
        allBtn.addEventListener('click', () => {
          allOn = !allOn;
          neLayers.forEach((layer, i) => {
            boxes[i].checked = allOn;
            setVis(layer, allOn);
          });
        });
        layersPanel.hidden = false;
      }

      function teardownInspector() {
        layersPanel.hidden = true;
        layersPanel.innerHTML = '';
        neLayers = [];
        if (popup) { popup.remove(); popup = null; }
        if (map) map.getCanvas().style.cursor = '';
      }

      // Bound once, after the map exists: click → select + attributes,
      // hover → pointer cursor. No-ops unless an inspector is active.
      function bindInspector() {
        document.getElementById('map').appendChild(layersPanel);
        const hitIds = () => neLayers.flatMap((l) => l.ids).filter((id) => map.getLayer(id));

        map.on('click', (e) => {
          if (!neLayers.length) return;
          const ids = hitIds();
          const feats = ids.length ? map.queryRenderedFeatures(e.point, { layers: ids }) : [];
          const sel = map.getSource('selected');
          if (!feats.length) {
            if (sel) sel.setData(EMPTY_FC);
            if (popup) { popup.remove(); popup = null; }
            return;
          }
          const f = feats[0];
          if (sel) {
            sel.setData({ type: 'FeatureCollection',
              features: [{ type: 'Feature', geometry: f.geometry, properties: {} }] });
          }
          const props = f.properties || {};
          const rows = Object.keys(props).sort().map((k) =>
            `<tr><td class="k">${esc(k)}</td><td>${esc(props[k])}</td></tr>`).join('');
          const html = `<div class="ne-pop"><div class="h">${esc(f.sourceLayer)}</div>` +
            (rows ? `<table>${rows}</table>` : '<em>no attributes</em>') + '</div>';
          if (popup) popup.remove();
          popup = new maplibregl.Popup({ maxWidth: '300px' })
            .setLngLat(e.lngLat).setHTML(html).addTo(map);
        });

        map.on('mousemove', (e) => {
          if (!neLayers.length) return;
          const ids = hitIds();
          const hit = ids.length && map.queryRenderedFeatures(e.point, { layers: ids }).length;
          map.getCanvas().style.cursor = hit ? 'pointer' : '';
        });
      }

      // -- selection / map ------------------------------------------
      const ensureMap = (style) => {
        if (!map) {
          map = new maplibregl.Map({
            container: 'map',
            style,
            center: [139.7, 35.7],
            zoom: 4,
            hash: true,
          });
          map.addControl(new maplibregl.NavigationControl());
          map.addControl(new maplibregl.ScaleControl());
          bindInspector();
        } else {
          map.setStyle(style);
        }
      };

      const select = async (t) => {
        selected = t;
        for (const [id, card] of cards) {
          card.classList.toggle('selected', id === t.id);
        }

        const u = new URL(location.href);
        u.searchParams.set('id', t.id);
        u.searchParams.delete('mode'); // legacy toggle param
        history.replaceState(null, '', u.toString());

        copyTilejson.disabled = false;
        copyXyz.disabled = false;
        cards.get(t.id)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });

        // Raster: show served tiles, no inspector.
        if (t.type !== 'vector') {
          teardownInspector();
          ensureMap(rasterStyle(t.tilejson));
          return;
        }

        // Vector: inspector when the TileJSON lists vector_layers,
        // otherwise fall back to a MapLibre style (protomaps ships
        // none of its own, so use the light theme).
        let tj = null;
        try {
          tj = await fetch(t.tilejson).then((r) => r.json());
        } catch (e) {}
        if (tj && Array.isArray(tj.vector_layers) && tj.vector_layers.length) {
          ensureMap(buildInspectorStyle(t, tj));
          setupInspector();
        } else {
          teardownInspector();
          ensureMap(t.style || '/styles/light/style.json');
        }
      };

      const params = new URLSearchParams(location.search);
      const initial =
        tilesets.find((t) => t.id === params.get('id')) || tilesets[0];
      if (initial) select(initial);

      // -- copy buttons ----------------------------------------------
      // TileJSON URL comes straight from the catalog entry; the XYZ
      // URL is read out of the live TileJSON document (so
      // format-flavoured tilesets like esa_worldcover yield their
      // default extension automatically).
      const flashCopied = (btn) => {
        btn.classList.add('copied');
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = orig;
        }, 1200);
      };

      copyTilejson.addEventListener('click', async () => {
        if (!selected) return;
        const url = new URL(selected.tilejson, location.href).toString();
        await navigator.clipboard.writeText(url);
        flashCopied(copyTilejson);
      });

      copyXyz.addEventListener('click', async () => {
        if (!selected) return;
        copyXyz.disabled = true;
        try {
          const tj = await fetch(selected.tilejson).then((r) => r.json());
          const xyz = tj.tiles && tj.tiles[0];
          if (!xyz) throw new Error('no tiles[] in TileJSON');
          await navigator.clipboard.writeText(xyz);
          flashCopied(copyXyz);
        } catch (e) {
          copyXyz.textContent = 'Failed';
          setTimeout(() => { copyXyz.textContent = 'Copy XYZ URL'; }, 1500);
        } finally {
          copyXyz.disabled = false;
        }
      });
    }

    init();
  </script>
</body>
</html>
